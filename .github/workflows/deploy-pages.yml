name: Publish review portal to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: review-portal-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/configure-pages.mjs --require-connected
        env:
          REVIEW_API_BASE_URL: ${{ vars.REVIEW_API_BASE_URL }}
          REVIEW_PORTAL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REVIEW_SUPABASE_URL: ${{ vars.REVIEW_SUPABASE_URL }}
          REVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.REVIEW_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run typecheck
      - run: npm run build
        env:
          PORTAL_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
